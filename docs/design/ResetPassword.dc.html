<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Geist:wght@400..600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0F1F}
*{box-sizing:border-box}
a{color:#A9BCFF;text-decoration:none}a:hover{color:#D3DDFF;text-decoration:underline}
input::placeholder{color:#6B7099}
input:focus{outline:none;border-color:#6C8CFF !important;box-shadow:0 0 0 3px rgba(108,140,255,.25)}
button:focus-visible,a:focus-visible{outline:2px solid #6C8CFF;outline-offset:2px}
.btn-primary:hover{background:#FFFFFF !important;text-decoration:none !important}
.link-btn:hover{color:#D3DDFF !important;text-decoration:underline}
</style>
</helmet>
<main style="min-height: 800px; display: flex; flex-direction: column; background: #0D0F1F; color: #EDEFFF; font-family: 'Geist', system-ui, sans-serif">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 32px">
<a href="Main.dc.html" aria-label="tic·tac·toe home" style="display: flex; align-items: center; gap: 10px; color: #EDEFFF">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1D2142"></rect><circle cx="10.5" cy="16" r="4.5" fill="none" stroke="#6C8CFF" stroke-width="2.5"></circle><path d="M18 11.5l9 9M27 11.5l-9 9" stroke="#FFA24C" stroke-width="2.5" stroke-linecap="round"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">tic·tac·toe</span>
</a>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 44px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
Back to sign in
</a>
</header>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 24px 96px">
<div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 28px; padding: 40px 36px; border-radius: 20px; background: #151830; border: 1px solid #22264D">
<ol aria-label="Steps" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500">
<li style="display: flex; align-items: center; gap: 8px; color: #EDEFFF">
<span style="width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{step1Bg}}; color: {{step1Color}}; font-size: 12px">1</span>
Email
</li>
<li aria-hidden="true" style="flex: 1; height: 1px; background: #2B3060"></li>
<li style="display: flex; align-items: center; gap: 8px; color: {{step2Label}}">
<span style="width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{step2Bg}}; color: {{step2Color}}; font-size: 12px">2</span>
New password
</li>
</ol>
<sc-if value="{{isEmailStep}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Forgot your password?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #A3A8CF">Enter the email you signed up with and we&#39;ll send you a reset code.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="email" style="font-size: 14px; font-weight: 500; color: #D6D9F5">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2B3060; background: #10132A; color: #EDEFFF; font: 400 15px 'Geist', sans-serif">
</div>
<button type="button" class="btn-primary" onClick="{{toCode}}" style="height: 46px; border: 0; border-radius: 10px; background: #EDEFFF; color: #0D0F1F; font: 600 15px 'Geist', sans-serif; cursor: pointer">Send reset code</button>
</form>
</sc-if>
<sc-if value="{{isCodeStep}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Set a new password</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #A3A8CF">Code sent to <span style="color: #EDEFFF; font-weight: 500">you@example.com</span>. <button type="button" class="link-btn" onClick="{{toEmail}}" style="padding: 0; border: 0; background: transparent; color: #A9BCFF; font: inherit; cursor: pointer">Change</button></p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="code" style="font-size: 14px; font-weight: 500; color: #D6D9F5">Reset code</label>
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits" style="width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2B3060; background: #10132A; color: #EDEFFF; font: 500 17px 'Geist Mono', monospace; letter-spacing: 0.2em">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="new-password" style="font-size: 14px; font-weight: 500; color: #D6D9F5">New password</label>
<input id="new-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="width: 100%; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2B3060; background: #10132A; color: #EDEFFF; font: 400 15px 'Geist', sans-serif">
</div>
<a href="Main.dc.html" class="btn-primary" style="height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #EDEFFF; color: #0D0F1F; font-size: 15px; font-weight: 600">Update password</a>
</form>
</sc-if>
</div>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { step: 'email' };

renderVals() {
const isCode = this.state.step === 'code';
return {
isEmailStep: !isCode,
isCodeStep: isCode,
step1Bg: isCode ? '#2B3060' : '#6C8CFF',
step1Color: isCode ? '#EDEFFF' : '#0D0F1F',
step2Bg: isCode ? '#6C8CFF' : '#1D2142',
step2Color: isCode ? '#0D0F1F' : '#A3A8CF',
step2Label: isCode ? '#EDEFFF' : '#A3A8CF',
toCode: () => { this.setState({ step: 'code' }); },
toEmail: () => { this.setState({ step: 'email' }); }
};
}
}
</script>
</body>
</html>
