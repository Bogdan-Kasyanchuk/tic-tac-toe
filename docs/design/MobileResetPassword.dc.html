<x-dc>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Geist:wght@400..600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0F1F}

<main style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; gap: 26px; padding: 44px 24px 32px; background: #0D0F1F; color: #EDEFFF; font-family: 'Geist', system-ui, sans-serif">
<a href="MobileSignIn.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
Back to sign in
</a>
<ol aria-label="Steps" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500">
<li style="display: flex; align-items: center; gap: 8px; color: #A3A8CF">
<span style="width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #2B3060; color: #EDEFFF">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
</span>
Email
</li>
<li aria-hidden="true" style="flex: 1; height: 1px; background: #2B3060"></li>
<li aria-current="step" style="display: flex; align-items: center; gap: 8px; color: #EDEFFF">
<span style="width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #6C8CFF; color: #0D0F1F; font-size: 12px">2</span>
New password
</li>
</ol>
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.03em">Set a new password</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #A3A8CF">Code sent to <span style="color: #EDEFFF; font-weight: 500">you@example.com</span>. <a href="#" style="font-weight: 500">Change</a></p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mr-code" style="font-size: 14px; font-weight: 500; color: #D6D9F5">Reset code</label>
<input id="mr-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits" style="width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2B3060; background: #10132A; color: #EDEFFF; font: 500 18px 'Geist Mono', monospace; letter-spacing: 0.25em">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mr-password" style="font-size: 14px; font-weight: 500; color: #D6D9F5">New password</label>
<input id="mr-password" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #2B3060; background: #10132A; color: #EDEFFF; font: 400 16px 'Geist', sans-serif">
</div>
<a href="MobileSignIn.dc.html" style="height: 48px; margin-top: 4px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #EDEFFF; color: #0D0F1F; font-size: 16px; font-weight: 600">Update password</a>
</form>
