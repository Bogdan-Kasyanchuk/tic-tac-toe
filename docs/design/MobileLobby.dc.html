<!doctype html>

<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Geist:wght@400..600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0F1F;line-height:1.35}
h1,h2,h3,h4{line-height:1.2}
*{box-sizing:border-box}
a{color:#A9BCFF;text-decoration:none}a:hover{color:#D3DDFF}
button,a,input{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .1s ease}
button:not(:disabled){cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:2px solid #6C8CFF;outline-offset:2px}
input:hover:not(:focus){border-color:#3A4080 !important}
input:focus{outline:none;border-color:#6C8CFF !important;box-shadow:0 0 0 3px rgba(108,140,255,.25)}
.btn-primary:hover{background:#FFFFFF !important;text-decoration:none !important}
.btn-primary:active{background:#D6D9F5 !important;transform:scale(.98)}
.btn-secondary:hover{background:#262B55 !important;border-color:#3A4080 !important;color:#EDEFFF !important;text-decoration:none !important}
.btn-secondary:active{background:#2B3060 !important;transform:scale(.98)}
.btn-ghost:hover{background:#1D2142 !important;color:#EDEFFF !important;text-decoration:none !important}
.btn-ghost:active{background:#262B55 !important}
.btn-destructive:hover{background:#3A1A28 !important}
.btn-destructive:active{background:#4A1F30 !important}
.icon-btn:hover{background:#262B55 !important;color:#EDEFFF !important;text-decoration:none !important}
.icon-btn:active{background:#2B3060 !important;transform:scale(.96)}
.menu-item:hover{background:#262B55 !important;text-decoration:none !important}
.menu-item:active{background:#2B3060 !important}
.tab:not([aria-pressed="true"]):hover{background:#1D2142 !important;color:#EDEFFF !important;text-decoration:none !important}
.tab:active{background:#262B55 !important}
.option[aria-pressed="false"]:hover{border-color:#4A5199 !important;background:#151830 !important}
.option:active{transform:scale(.98)}
.cell:not(:disabled):hover{background:#1D2142 !important;border-color:#3A4080 !important}
.cell:not(:disabled):active{background:#262B55 !important}
.link-btn:hover{color:#D3DDFF !important;text-decoration:underline}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0D0F1F; color: #EDEFFF; font-family: 'Geist', system-ui, sans-serif">

<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1D2142"></rect><circle cx="10.5" cy="16" r="4.5" fill="none" stroke="#6C8CFF" stroke-width="2.5"></circle><path d="M18 11.5l9 9M27 11.5l-9 9" stroke="#FFA24C" stroke-width="2.5" stroke-linecap="round"></path></svg>

<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em">Ready for a round, Alex?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.35; color: #A3A8CF">Start a new game, or join a friend with the ID they sent you.</p>
</div>
<div role="group" aria-label="Game type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #10132A; border: 1px solid #22264D">
<button class="tab" type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 8px; background: #2B3060; color: #EDEFFF; font: 600 16px 'Geist', sans-serif">New game</button>
<a class="tab" href="MobileLobbyJoin.dc.html" style="text-decoration: none; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A3A8CF; font-size: 16px; font-weight: 600">Join a game</a>
</div>
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #D6D9F5; line-height: 1">Play as</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 600">Circle</span><span style="font-size: 14px; color: #A3A8CF">First</span></span>
</button>
<button class="option" type="button" aria-pressed="false" style="height: 60px; display: flex; flex-direction: row; align-items: center; gap: 12px; padding: 0 12px; border-radius: 16px; border: 2px solid #2B3060; background: #10132A; color: #EDEFFF; text-align: left; font-family: 'Geist', sans-serif">
<svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><path d="M24 24 76 76M76 24 24 76" stroke="#FFA24C" stroke-width="13" stroke-linecap="round"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 600">Cross</span><span style="font-size: 14px; color: #A3A8CF">Second</span></span>
</button>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 500; color: #D6D9F5; line-height: 1">Game ID</span>
<div style="display: flex; gap: 8px">
<p style="flex: 1; min-width: 0; margin: 0; height: 50px; display: flex; align-items: center; padding: 0 16px; border-radius: 12px; border: 1px solid #2B3060; background: #10132A; font: 500 18px 'Geist Mono', monospace; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.35">V1StGXR8_Z5jdHi6B-myT</p>
<button class="icon-btn" type="button" aria-label="Generate a new game ID" style="width: 50px; height: 50px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #2B3060; background: #1D2142; color: #A3A8CF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg>
</button>
<button class="icon-btn" type="button" aria-label="Copy game ID" style="width: 50px; height: 50px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #2B3060; background: #1D2142; color: #A3A8CF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
</button>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.35; color: #A3A8CF; margin-top: -4px">Generated for you. Your friend joins with this ID.</p>
</div>
<a class="btn-primary" href="MobileWaiting.dc.html" style="margin-top: 8px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #EDEFFF; color: #0D0F1F; font-size: 18px; font-weight: 600">
Create game
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
</a>
</main>
</div>
