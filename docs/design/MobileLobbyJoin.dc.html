<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby on a phone: joining a game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Geist:wght@400..600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0F1F;line-height:1.35}
h1,h2,h3,h4{line-height:1.2}
*{box-sizing:border-box}
a{color:#A9BCFF;text-decoration:none}a:hover{color:#D3DDFF}
input::placeholder{color:#6B7099}
button,a,input{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .1s ease}
button:not(:disabled){cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:2px solid #6C8CFF;outline-offset:2px}
input:hover:not(:focus){border-color:#3A4080 !important}
input:focus{outline:none;border-color:#6C8CFF !important;box-shadow:0 0 0 3px rgba(108,140,255,.25)}
.btn-primary:hover{background:#FFFFFF !important;text-decoration:none !important}
.btn-primary:active{background:#D6D9F5 !important;transform:scale(.98)}
.btn-secondary:hover{background:#262B55 !important;border-color:#3A4080 !important;color:#EDEFFF !important;text-decoration:none !important}
.btn-secondary:active{background:#2B3060 !important;transform:scale(.98)}
.btn-ghost:hover{background:#1D2142 !important;color:#EDEFFF !important;text-decoration:none !important}
.btn-ghost:active{background:#262B55 !important}
.btn-destructive:hover{background:#3A1A28 !important}
.btn-destructive:active{background:#4A1F30 !important}
.icon-btn:hover{background:#262B55 !important;color:#EDEFFF !important;text-decoration:none !important}
.icon-btn:active{background:#2B3060 !important;transform:scale(.96)}
.menu-item:hover{background:#262B55 !important;text-decoration:none !important}
.menu-item:active{background:#2B3060 !important}
.tab:not([aria-pressed="true"]):hover{background:#1D2142 !important;color:#EDEFFF !important;text-decoration:none !important}
.tab:active{background:#262B55 !important}
.option[aria-pressed="false"]:hover{border-color:#4A5199 !important;background:#151830 !important}
.option:active{transform:scale(.98)}
.cell:not(:disabled):hover{background:#1D2142 !important;border-color:#3A4080 !important}
.cell:not(:disabled):active{background:#262B55 !important}
.link-btn:hover{color:#D3DDFF !important;text-decoration:underline}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0D0F1F; color: #EDEFFF; font-family: 'Geist', system-ui, sans-serif">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 48px 20px 12px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1D2142"></rect><circle cx="10.5" cy="16" r="4.5" fill="none" stroke="#6C8CFF" stroke-width="2.5"></circle><path d="M18 11.5l9 9M27 11.5l-9 9" stroke="#FFA24C" stroke-width="2.5" stroke-linecap="round"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700">tic·tac·toe</span>
</div>
<button class="icon-btn" type="button" aria-label="Open menu" aria-haspopup="menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; border: 1px solid #2B3060; background: #151830; color: #EDEFFF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
</button>
</header>
<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 20px 20px 36px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em">Ready for a round, Sam?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.35; color: #A3A8CF">Start a new game, or join a friend with the ID they sent you.</p>
</div>
<div role="group" aria-label="Game type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #10132A; border: 1px solid #22264D">
<a class="tab" href="MobileLobby.dc.html" style="text-decoration: none; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #A3A8CF; font-size: 16px; font-weight: 600">New game</a>
<button class="tab" type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 8px; background: #2B3060; color: #EDEFFF; font: 600 16px 'Geist', sans-serif">Join a game</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mj-code" style="font-size: 14px; font-weight: 500; color: #D6D9F5">Game ID</label>
<div style="display: flex; gap: 8px">
<input id="mj-code" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the ID" value="{{joinCode}}" onChange="{{onJoinInput}}" style="flex: 1; min-width: 0; height: 50px; padding: 0 16px; border-radius: 12px; border: 1px solid #2B3060; background: #10132A; color: #EDEFFF; font: 500 18px 'Geist Mono', monospace">
<button class="icon-btn" type="button" aria-label="Paste from clipboard" style="width: 50px; height: 50px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 1px solid #2B3060; background: #1D2142; color: #A3A8CF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
</button>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.35; color: #A3A8CF">Opened an invite link? The ID is filled in for you.</p>
</div>
<div style="height: 80px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-radius: 16px; background: #10132A; border: 1px solid #22264D">
<svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><path d="M24 24 76 76M76 24 24 76" stroke="#FFA24C" stroke-width="13" stroke-linecap="round"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">You play as the free mark</span>
<span style="font-size: 14px; color: #A3A8CF">You get the free mark. Circle moves first.</span>
</span>
</div>
<a class="btn-primary" href="MobileOpponent.dc.html" style="margin-top: auto; height: 50px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #EDEFFF; color: #0D0F1F; font-size: 18px; font-weight: 600">
Join game
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { joinCode: 'V1StGXR8_Z5jdHi6B-myT' };

renderVals() {
return {
joinCode: this.state.joinCode,
onJoinInput: (event) => { this.setState({ joinCode: event.target.value }); }
};
}
}
</script>
</body>
</html>
