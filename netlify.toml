[build]
  command = "npx convex deploy --cmd 'npm run build'"
  publish = "dist"

# Та сама Node, що й локально (nvm); сайт створено ще під CRA, тож версію за замовчуванням не беремо на віру
[build.environment]
  NODE_VERSION = "24.19.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
